<ion-header class="vendor-header">
  <ion-toolbar>
    <ion-buttons slot="start">
  <ion-button fill="clear" (click)="close()">
    <ion-icon name="arrow-back"></ion-icon>
  </ion-button>
</ion-buttons>

    <ion-title>
      {{ mode === 'add' ? 'Add Vendor' : 'Edit Vendor' }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="vendor-content">

  <div class="form-wrapper">

    <div class="form-group">
      <label>Vendor Name</label>
      <ion-input [(ngModel)]="form.title"></ion-input>
    </div>

    <div class="form-group">
      <label>Phone</label>
      <ion-input [(ngModel)]="form.phone"></ion-input>
    </div>

    <div class="form-group">
      <label>Email</label>
      <ion-input [(ngModel)]="form.email"></ion-input>
    </div>

    <div class="form-group">
      <label>Address</label>
      <ion-textarea rows="3" [(ngModel)]="form.address"></ion-textarea>
    </div>

  </div>

</ion-content>

<!-- Create Vendor -->
<ion-footer class="vendor-footer" *ngIf="mode === 'add'">
  <ion-button expand="block" (click)="save()">
    Create Vendor
  </ion-button>
</ion-footer>

<!-- Update Vendor -->
<ion-footer class="vendor-footer" *ngIf="mode === 'edit'">
  <ion-button expand="block" (click)="save()">
    Update Vendor
  </ion-button>
</ion-footer>

<!-- Delete Vendor -->
<ion-button
  *ngIf="mode === 'edit'"
  expand="block"
  fill="outline"
  class="delete-btn"
  (click)="deleteVendor()"
>
  Delete Vendor
</ion-button>
