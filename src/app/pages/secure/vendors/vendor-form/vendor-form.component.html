<ion-header class="vendor-header">
  <ion-toolbar>
    <ion-buttons slot="start">
  <ion-button fill="clear" (click)="close()">
    <ion-icon ios="chevron-back" md="arrow-back-outline"></ion-icon>
  </ion-button>
</ion-buttons>

    <ion-title>
      {{ mode === 'add' ? 'Add Vendor' : 'Edit Vendor' }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="vendor-content">

  <div class="form-wrapper">

    <div class="form-group">
      <label>Vendor Name</label>
      <ion-input
  [(ngModel)]="form.title"
  (ionInput)="onVendorNameInput($event)"
  (ionBlur)="vendorNameTouched = true">
</ion-input>

<div
  class="error-text"
  *ngIf="
    vendorNameTouched &&
    form.title &&
    containsEmoji(form.title)
  ">
  Vendor Name cannot contain emojis
</div>
    </div>

    <div class="form-group">
      <label>Phone</label>

      <ion-input
        type="tel"
        maxlength="10"
        [(ngModel)]="form.phone"
        (ionInput)="onPhoneInput($event)"
        [class.error]="phoneError">
      </ion-input>

      <div class="error-text" *ngIf="phoneError">
        {{ phoneError }}
      </div>
    </div>

    <div class="form-group">
      <label>Email</label>

      <ion-input
        type="email"
        [(ngModel)]="form.email"
        (ionInput)="onEmailInput($event)"
        [class.error]="emailError">
      </ion-input>

      <div class="error-text" *ngIf="emailError">
        {{ emailError }}
      </div>
    </div>

    <div class="form-group">
      <label>Address</label>
      <ion-textarea
  rows="3"
  [(ngModel)]="form.address"
  (ionInput)="onAddressInput($event)"
  (ionBlur)="addressTouched = true">
</ion-textarea>

<div
  class="error-text"
  *ngIf="
    addressTouched &&
    form.address &&
    containsEmoji(form.address)
  ">
  Address cannot contain emojis
</div>
    </div>

  </div>

  <!-- ACTION BUTTONS -->
<div class="form-buttons">

  <!-- CREATE / UPDATE -->
  <ion-button
  expand="block"
  class="save-btn"
  (click)="save()"
  [disabled]="
  isSaving ||
  !form.title?.trim() ||
  containsEmoji(form.title) ||
  containsEmoji(form.address) ||
  !!phoneError ||
  !!emailError
"
>
  {{ isSaving 
      ? (mode === 'add' ? 'Creating...' : 'Updating...') 
      : (mode === 'add' ? 'Create Vendor' : 'Update Vendor') 
  }}
</ion-button>

  <!-- DELETE (ONLY EDIT) -->
  <ion-button
  *ngIf="mode === 'edit'"
  expand="block"
  fill="outline"
  color="danger"
  class="delete-btn"
  (click)="confirmDelete()"
>
  Delete Vendor
</ion-button>

</div>

</ion-content>
