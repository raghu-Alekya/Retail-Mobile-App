<ng-container>
<ion-content [fullscreen]="true" class="">
  <div class="mt-3 d-flex justify-content-between align-items-center">
    <div>
      <ion-title size="large">Welcome Admin!</ion-title>
      <ion-title size="large">Dashboard</ion-title>
    </div>
    <!-- <div>
      <ion-button fill="clear" size="small" class="ion-float-end" routerLink="/settings">
        <ion-icon name="settings-outline" slot="start"></ion-icon></ion-button>
    </div> -->
  </div>
  <div class="ion-padding dashboard-header">
    <ion-card class="mt-3 py-2" class="bg-white">
      <ion-label class="home-slides mb-3 ion-margin-top" >Order Status</ion-label>
      <ion-slides [options]="slideOpts" class="home-slides mb-3">
        <ion-slide *ngFor="let status of statuses" class="p-0">
          <ion-card class="slide-card ion-text-center">
            <ion-card-content>
              <ion-icon
                [name]="status.icon"
                size="large"
                [style.color]="status.color">
              </ion-icon>

              <h3>{{ status.count }}</h3>
              <p>{{ status.label }}</p>
              
            </ion-card-content>
          </ion-card>
        </ion-slide>
      </ion-slides>
    </ion-card>

    <ion-card class="mt-3 bg-white">
      <ion-card-header class="chart-header">

  <ion-card-title>
    Daily Sales (Last 7 Days)
  </ion-card-title>

  <div class="chart-dropdown">
    <div class="selected-value" (click)="select.open()">
      <span class="dot" [ngClass]="chartType"></span>

      <span class="text" [ngClass]="chartType">
        {{ chartType === 'sales' ? 'Sales' : 'Orders' }}
      </span>

      <ion-icon name="chevron-down-outline"></ion-icon>
    </div>

    <ion-select
      #select
      [(ngModel)]="chartType"
      interface="popover"
      (ionChange)="onChartTypeChange()"
      class="hidden-select"
    >
      <ion-select-option value="sales">Sales</ion-select-option>
      <ion-select-option value="orders">Orders</ion-select-option>
    </ion-select>
  </div>

</ion-card-header>
<ion-card-content class="chart-content">

  <!-- 🔥 Loader -->
  <div *ngIf="isChartLoading" class="chart-loader">
    <div class="emoji-loader">📊</div>
    <p>Loading analytics...</p>
  </div>

  <!-- Chart -->
  <canvas
    id="dailySalesChart"
    *ngIf="!isChartLoading">
  </canvas>

</ion-card-content>
      

  <div class="view-more-center" routerLink="/reports">
  View More Details
</div>

</ion-card>
    <ion-grid class="grid-compact">
      <ion-row>
        <ion-col
          size="4"
          size-md="4"
          *ngFor="let item of items"
          class="grid-col"
        >
          <ion-card
            class="grid-card ion-text-center"
            [routerLink]="item.route"
            button
          >
            <ion-card-content>
              <ion-icon
              [name]="item.icon"
              class="dashboard-icon"
              [style.color]="item.color"
              [style.background]="item.bg_color"
            ></ion-icon>

              <ion-card-title>{{ item.title }}</ion-card-title>
            </ion-card-content>
            
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

</ion-content>
</ng-container>
<ng-template #loading>
  <ion-skeleton-text animated style="width: 100%; height: 120px"></ion-skeleton-text>
</ng-template>
