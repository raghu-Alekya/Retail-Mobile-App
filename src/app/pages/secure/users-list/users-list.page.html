<ion-header class="dark-toolbar" *ngIf="!editingUserId">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home"></ion-back-button>
    </ion-buttons>

    <ion-title>Employees</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="openAddEmployee()">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>


  <!-- Search -->
  <div class="search-wrapper">
    <ion-icon name="search-outline"></ion-icon>
    <input
      type="text"
      placeholder="Search"
      (input)="onSearch($event)"
    />
  </div>
</ion-header>
<ion-content class="employees-content">

  <div class="list-heading">
    Employee List
  </div>

  <ion-list>

    <ion-item
      lines="none"
      *ngFor="let user of filteredUsers; let i = index"
      (click)="editEmployee(user)"
    >

      <div class="employee-card"
           [ngClass]="'card-color-' + (i % 5)">

        <div class="role-label">
          • {{ getRoleLabel(user.roles) }}
        </div>

        <div class="card-content">

          <div class="avatar" [ngClass]="'avatar-' + (i % 5)">
            <ion-icon name="person-outline"></ion-icon>
          </div>

          <div class="details">
            <div class="name">{{ user.name }}</div>

            <div class="login-id">
              Login Pin: {{ user.meta?.emp_login_pin || 'Not Set' }}
            </div>
          </div>

        </div>

      </div>

    </ion-item>

  </ion-list>

<!-- EDIT EMPLOYEE FULL SCREEN -->
<div class="edit-overlay" *ngIf="editingUserId">

  <!-- Fixed Header -->
  <ion-header class="dark-toolbar">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-button (click)="cancelEdit()">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </ion-button>
      </ion-buttons>

      <ion-title>Edit Employee</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Scrollable Form -->
  <div class="edit-content">

    <div class="edit-popup">

    <!-- Username -->
    <div class="form-field">
      <label>Username</label>
      <ion-input
        placeholder="Enter username"
        [(ngModel)]="editedUser.username"
        (ionInput)="checkChanges()">
      </ion-input>
    </div>

    <!-- Email -->
    <div class="form-field">
      <label>Email</label>
      <ion-input
        placeholder="Enter email address"
        [(ngModel)]="editedUser.email"
        (ionInput)="checkChanges()">
      </ion-input>
    </div>

    <!-- First Name -->
    <div class="form-field">
      <label>First Name</label>
      <ion-input
        placeholder="Enter first name"
        [(ngModel)]="editedUser.first_name"
        (ionInput)="checkChanges()">
      </ion-input>
    </div>

    <!-- Last Name -->
    <div class="form-field">
      <label>Last Name</label>
      <ion-input
        placeholder="Enter last name"
        [(ngModel)]="editedUser.last_name"
        (ionInput)="checkChanges()">
      </ion-input>
    </div>

    <!-- Role -->
    <div class="form-field">
      <label>Employee Role</label>
      <ion-select
        placeholder="Select Employee Role"
        [(ngModel)]="editedUser.role"
        (ionChange)="checkChanges()"
        interface="popover">

        <ion-select-option
          *ngFor="let role of customRoles"
          [value]="role.key">
          {{ role.name }}
        </ion-select-option>

      </ion-select>
    </div>

    <!-- Phone -->
    <div class="form-field">
      <label>Phone</label>
      <ion-input
        placeholder="Enter phone number"
        [(ngModel)]="editedUser.phone"
        (ionInput)="checkChanges()">
      </ion-input>
    </div>

    <!-- Login PIN -->
    <div class="form-field">
      <label>Login PIN</label>
      <ion-input
        type="text"
        placeholder="Enter 6-digit PIN"
        [(ngModel)]="editedUser.emp_login_pin"
        (ionInput)="checkChanges()">
      </ion-input>
    </div>


<!-- Buttons -->
<div class="form-buttons">

  <ion-button
  expand="block"
  class="save-btn"
  *ngIf="isChanged"
  (click)="saveChanges()">
  Save Changes
</ion-button>

  <div class="delete-section">
    <ion-button
      expand="block"
      color="danger"
      fill="outline"
      (click)="deleteUser(editingUserId)">
      Delete Employee
    </ion-button>
  </div>

</div>
      <!-- <ion-button
        expand="block"
        fill="clear"
        (click)="cancelEdit()">
        Cancel
      </ion-button> -->

 

  </div>

</div>
</div>
