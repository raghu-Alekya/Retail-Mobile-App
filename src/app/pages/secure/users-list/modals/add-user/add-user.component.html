<ion-header>
  <ion-toolbar class="dark-toolbar">
    <ion-title>Add Employee</ion-title>
    <ion-buttons slot="start">
  <ion-button (click)="close()">
    <ion-icon 
      ios="chevron-back" 
      md="arrow-back-outline">
    </ion-icon>
  </ion-button>
</ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Username -->
   <ion-label position="stacked">Username</ion-label>
  <ion-item class="form-field">
    <ion-input
      [(ngModel)]="user.username"
      name="username"
      placeholder="Enter username">
    </ion-input>
  </ion-item>

  <!-- Email -->
  <ion-label position="stacked">Email</ion-label>
  <ion-item class="form-field">
    <ion-input
      type="email"
      [(ngModel)]="user.email"
      placeholder="Enter email address">
    </ion-input>
  </ion-item>

  <!-- Error message -->
  <p class="error-text" *ngIf="user.email && !isValidEmail(user.email)">
    Please enter a valid email format.
  </p>

  <!-- First Name -->
   <ion-label position="stacked">First Name</ion-label>
  <ion-item class="form-field">
    
    <ion-input
      [(ngModel)]="user.first_name"
      placeholder="Enter first name">
    </ion-input>
  </ion-item>

  <!-- Last Name -->
   <ion-label position="stacked">Last Name</ion-label>
  <ion-item class="form-field">
    
    <ion-input
      [(ngModel)]="user.last_name"
      placeholder="Enter last name">
    </ion-input>
  </ion-item>

  

  <!-- Phone -->
   <ion-label position="stacked">Phone</ion-label>
  <ion-item class="form-field"
  [class.invalid]="phoneTouched && user.phone && !isValidPhone(user.phone)">
    
    <ion-input
      type="tel"
      inputmode="numeric"
      maxlength="10"
      [(ngModel)]="user.phone"
      (ionInput)="limitPhoneLength($event)"
      (ionBlur)="phoneTouched = true"
      placeholder="Enter phone number">
    </ion-input>
  </ion-item>
 
  <p class="error-text" *ngIf="phoneTouched && user.phone && !isValidPhone(user.phone)">
    Please enter a valid 10-digit phone number
  </p>
  <!-- Login PIN -->
   <!-- Login PIN -->
<ion-label position="stacked">Login PIN</ion-label>

<ion-item 
  class="form-field"
  [class.invalid]="
    (pinTouched && user.emp_login_pin && !isValidPin(user.emp_login_pin)) 
    || pinError
  ">
  
 <ion-input
  type="tel"
  inputmode="numeric"
  maxlength="6"
  [(ngModel)]="user.emp_login_pin"
  (ionInput)="limitPinLength($event)"
  (ionBlur)="pinTouched = true"
  placeholder="Enter 6-digit PIN">
</ion-input>

</ion-item>

<!-- Format error -->
<p class="error-text" *ngIf="pinTouched && user.emp_login_pin && !isValidPin(user.emp_login_pin)">
  PIN must be exactly 6 digits
</p>

<!-- 🔴 Backend duplicate error -->
<p class="error-text" *ngIf="pinError">
  {{ pinError }}
</p>

<!-- Employee Role -->
   <ion-label position="stacked">Employee Role</ion-label>
  <ion-item class="form-field">
    
    <ion-select
      [(ngModel)]="user.role"
      placeholder="Select Employee Role"
      interface="popover">

      <ion-select-option
        *ngFor="let role of customRoles"
        [value]="role.key">
        {{ role.name }}
      </ion-select-option>

    </ion-select>
  </ion-item>

 <ion-button
  expand="block"
  class="create-user-btn"
  [disabled]="
    isCreatingUser ||
    !isValidEmail(user.email) ||
    (user.phone && !isValidPhone(user.phone)) ||
    (user.emp_login_pin && !isValidPin(user.emp_login_pin))
  "
  (click)="submit()">

  {{ isCreatingUser ? 'Creating User...' : 'Create User' }}

</ion-button>

</ion-content>
