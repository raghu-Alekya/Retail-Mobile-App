<ion-header class="coupons-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title>Coupons</ion-title>

    <ion-buttons slot="end">
  <ion-button fill="clear" (click)="goToAddCoupon()">
    <ion-icon name="add-outline"></ion-icon>
  </ion-button>
</ion-buttons>

  </ion-toolbar>

  <!-- Search -->
  <div class="search-wrapper">
    <ion-icon name="search-outline"></ion-icon>
    <input type="text" placeholder="Search all Coupons" />
  </div>
</ion-header>


<ion-content class="coupons-content">

  <div class="coupon-card" *ngFor="let coupon of coupons">

    <!-- Top Section -->
    <div class="coupon-top">
      <div class="left">
        <ion-icon name="pricetag-outline"></ion-icon>
      </div>

      <div class="middle">
        <h3>Code: {{ coupon.code }}</h3>
        <p class="desc">{{ coupon.description }}</p>
        <p class="amount">
          Amount: {{ coupon.amount }} ({{ coupon.type }})
        </p>
      </div>

      <div class="right-id">
        #{{ coupon.id }}
      </div>
    </div>

    <hr />

    <!-- Bottom Section -->
    <div class="coupon-bottom">
      <div class="expiry">
        Expiration: {{ coupon.expiry }}
      </div>

      <div class="actions">
        <span class="usage">
          {{ coupon.used }}/{{ coupon.limit || 'Unlimited' }}
        </span>

        <button class="publish-btn">
          Publish
        </button>
      </div>
    </div>

  </div>

</ion-content>
