<ion-header>
  <ion-toolbar class="custom-header">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home"></ion-back-button>
    </ion-buttons>

    <ion-title>Coupons</ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="openAddCoupon()">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <div class="search-container">
    <ion-searchbar
      placeholder="Search all Coupons"
      [(ngModel)]="searchTerm"
      (ionInput)="filterCoupons()">
    </ion-searchbar>
  </div>
</ion-header>

<ion-content class="coupon-content">

  <ion-item-sliding *ngFor="let coupon of coupons">

    <!-- MAIN CARD -->
    <ion-item lines="none" class="coupon-card">

      <div class="card-row">

        <!-- Left Icon -->
        <div class="icon-box">
          <ion-icon name="pricetag-outline"></ion-icon>
        </div>

        <!-- Right Content -->
        <div class="card-content">

          <!-- Code -->
          <div class="code">Code: {{ coupon.code }}</div>

          <!-- Description -->
          <div class="description" *ngIf="coupon.description">
            {{ coupon.description }}
          </div>

          <!-- Amount -->
          <div class="amount">
            Amount: {{ coupon.amount }} (fixed cart)
          </div>

          <!-- Divider + ID -->
          <div class="divider-wrapper">
  <div class="divider-line"></div>
  <div class="coupon-id">#{{ coupon.id }}</div>
</div>

          <!-- Bottom Row -->
          <div class="bottom-row">
            <div class="usage">
              {{ coupon.usage_count || 0 }}/
              {{ coupon.usage_limit ? coupon.usage_limit : '100' }}
            </div>

            <div class="status">
              Publish
            </div>
          </div>

        </div>

      </div>

    </ion-item>

    <!-- SLIDE OPTIONS -->
    <ion-item-options side="end">

      <ion-item-option color="primary" (click)="editCoupon(coupon)">
        <ion-icon name="create-outline"></ion-icon>
        Edit
      </ion-item-option>

      <ion-item-option color="danger" (click)="deleteCoupon(coupon)">
        <ion-icon name="trash-outline"></ion-icon>
        Delete
      </ion-item-option>

    </ion-item-options>

  </ion-item-sliding>

</ion-content>
